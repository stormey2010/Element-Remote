name: Build and upload to TestFlight
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: element-testflight-${{ github.ref }}
  cancel-in-progress: false
jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      APPLE_TEAM_ID: JUV7448PYM
      IOS_BUNDLE_ID: app.elementremote.mobile
      FASTLANE_SKIP_UPDATE_CHECK: '1'
      FASTLANE_HIDE_CHANGELOG: '1'
      FASTLANE_OPT_OUT_USAGE: '1'
      FASTLANE_DONT_STORE_PASSWORD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - name: Install and validate
        run: |
          npm ci
          npm run ios:sync
          npm test
          swift test --package-path native/OSCWire
          bundle install
      - name: Set the Apple build number
        shell: bash
        run: |
          echo "IOS_BUILD_NUMBER=$(date -u +%j.%H.%M)" >> "$GITHUB_ENV"
      - name: Sign and upload to TestFlight
        env:
          SIGNING_JSON: ${{ secrets.ELEMENT_SIGNING_BUNDLE }}
          TMPDIR: ${{ runner.temp }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test -n "$SIGNING_JSON"
          SIGNING_INPUT_DIR="$(mktemp -d "$RUNNER_TEMP/element-input.XXXXXX")"
          export ELEMENT_SIGNING_BUNDLE="$SIGNING_INPUT_DIR/signing.json"
          printf '%s' "$SIGNING_JSON" > "$ELEMENT_SIGNING_BUNDLE"
          unset SIGNING_JSON
          bundle exec fastlane ios beta
      - name: Keep the signed app
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Element-Remote-TestFlight-${{ github.run_number }}
          path: artifacts/testflight/*.ipa
          retention-days: 3
          if-no-files-found: error
      - name: Remove temporary signing material
        if: always()
        shell: bash
        run: |
          find "$RUNNER_TEMP" -maxdepth 1 -type d \( -name 'element-signing*' -o -name 'element-input.*' \) -exec rm -rf -- {} +
          security delete-keychain element_build-db 2>/dev/null || true
