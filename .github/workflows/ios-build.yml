name: Validate iOS app
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: npm ci
      - run: npm run ios:sync
      - run: swift test --package-path native/OSCWire
      - run: xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath .build-ios-simulator CODE_SIGNING_ALLOWED=NO build
      - run: xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath .build-ios-device CODE_SIGNING_ALLOWED=NO build
      - uses: actions/upload-artifact@v4
        with:
          name: Element-Remote-unsigned-builds
          path: |
            .build-ios-simulator/Build/Products/Debug-iphonesimulator/App.app
            .build-ios-device/Build/Products/Release-iphoneos/App.app
          retention-days: 7
